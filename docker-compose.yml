
services:
  # Frontend React Service
  frontend:
    build:
      context: ./frontend-react
      dockerfile: Dockerfile
      target: ${NODE_ENV:-development}
    ports:
      - "5173:5173"
    volumes:
      - ./frontend-react:/app
      - /app/node_modules
    environment:
      - NODE_ENV=${NODE_ENV:-development}
      - VITE_API_URL=http://backend:5000
      - VITE_LISTENING_SERVICE_URL=http://listening-comp:8000
    command: npm run dev -- --host 0.0.0.0
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:5173/health', (r) => r.statusCode === 200 ? process.exit(0) : process.exit(1))"]
      interval: 30s
      timeout: 10s
      retries: 3
    depends_on:
      backend:
        condition: service_healthy
      listening-comp:
        condition: service_healthy
    env_file:
      - .env
    networks:
      - frontend-network
      - backend-network

  # Flask Backend Service
  backend:
    build:
      context: ./backend-flask
      dockerfile: Dockerfile
    ports:
      - "5000:5000"
    env_file:
      - .env
    volumes:
      - ./backend-flask:/app
      - ./backend-flask/words.db:/app/words.db
    environment:
      - FLASK_APP=app/__init__.py
      - FLASK_ENV=development
      - FLASK_DEBUG=1
      - PYTHONPATH=/app
      - GUARDRAILS_ENABLED=true
      - CORS_ALLOWED_ORIGINS=http://localhost:5173,http://localhost:80,http://localhost:5000
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - backend-network
    command: ["flask", "--app", "app/__init__.py", "run", "--host", "0.0.0.0"]

  
  vocab-importer:
    build:
      context: ./vocab-importer
      dockerfile: Dockerfile
    ports:
      - "5001:5001"
    environment:
      - BACKEND_URL=http://backend:5000
      - FRONTEND_URL=http://frontend:5173
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5001/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - backend-network

  writing-practice:
    build:
      context: ./frontend-react
      target: development
    ports:
      - "5173:5173"
    volumes:
      - ./frontend-react:/app
      - /app/node_modules
    environment:
      - NODE_ENV=development
      - VITE_BACKEND_URL=http://backend:5000
    depends_on:
      - backend
    networks:
      - backend-network

  # Listening Comprehension Service
  listening-comp:
    build:
      context: ./listening-comp
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    volumes:
      - ./listening-comp:/app
      - ./.env:/app/.env
    environment:
      - PYTHONPATH=/app
      - AWS_ACCESS_KEY_ID=${AWS_ACCESS_KEY_ID}
      - AWS_SECRET_ACCESS_KEY=${AWS_SECRET_ACCESS_KEY}
      - AWS_DEFAULT_REGION=${AWS_DEFAULT_REGION}
      - OPENAI_API_KEY=${OPENAI_API_KEY}
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 5s
    networks:
      - backend-network

  speaking-practice:
    build:
      context: ./speaking-practice
      dockerfile: Dockerfile
    ports:
      - "7863:7863"
    env_file:
      - .env
    environment:
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - OPENAI_API_BASE=${OPENAI_API_BASE:-https://api.openai.com/v1}
    networks:
      - backend-network

networks:
  frontend-network:
    driver: bridge
  backend-network:
    driver: bridge
  ai-network:
    driver: bridge
  monitoring-network:
    driver: bridge